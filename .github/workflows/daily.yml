name: fluxo-diario

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 em São Paulo (UTC-3)
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FLUXO_DRY_RUN: ${{ vars.FLUXO_DRY_RUN || '1' }}
      FLUXO_FROM_EMAIL: ${{ vars.FLUXO_FROM_EMAIL }}
      FLUXO_UNSUBSCRIBE_URL: ${{ vars.FLUXO_UNSUBSCRIBE_URL }}
      FLUXO_FROM_NAME: ${{ vars.FLUXO_FROM_NAME }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -s tests -t . -v
      - name: Importar lista de prospects (idempotente)
        run: python -m fluxo.import_prospects data/campinas_barbearias_saloes.csv
      - name: Envio do dia (dry-run por padrão)
        run: python -m fluxo.send_emails
      - name: Relatório
        run: python -m fluxo.report | tee relatorio.md
      - uses: actions/upload-artifact@v4
        with:
          name: relatorio-diario
          path: relatorio.md
